# Sizes substituted for LearnLib's real-size adversarial/random examples in the IT suite,
# chosen so each case finishes in well under a minute against lstar-rocq's extracted learners.
# Edit a value and rerun (`make harness-it` or `mvn verify -Dit.test=...`) -- no recompile
# needed. A system property of the same name overrides this file for a one-off run, e.g.:
#   mvn verify -Dit.test=LstarOCamlDFAIT -Dkeylock.lstar=30

# ExampleKeylock (single-symbol chain DFA; real LearnLib size is 100), used by
# LstarOCamlDFAIT. Measured: 25 states -> 38-39s, 26 -> 127s, 27 -> 467s.
keylock.lstar=25

# Same ExampleKeylock target, used by NLStarOCamlDFAIT (NL* over a nondeterministic
# hypothesis; residual-inclusion checks are more expensive per table cell than L*'s
# equality checks, hence the much smaller ceiling). Measured: 9 states -> 55.4s, 10 -> 102.2s.
keylock.nlstar=9
